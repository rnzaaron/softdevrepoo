<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class schedule</title></head>
<body><nav id="nav"></nav><main><h1 id="title"></h1><p class="subhead" id="scheduleIntro"></p><div id="box"></div></main>
<script src="common.js"></script><script>
// Schedule queries are restricted on the server to the user's teaching assignments or section.
init('Class schedule');
async function load() {
  try {
    const schedules = await api('schedules');
    document.getElementById('scheduleIntro').textContent = ['student', 'parent'].includes(user.role) ? `Personalized schedule for ${user.childSection || user.section || 'your section'}.` : 'Teaching assignments and substitute coverage.';
    const admin = user.role === 'admin'; const staff = ['admin', 'adviser'].includes(user.role);
    const controls = admin ? `<section class="card"><div class="toolbar"><h2>Schedule planner</h2><button onclick="generate()">Generate from assignments</button></div><p class="muted">Generation replaces the current timetable and avoids teacher, room, and section overlaps.</p>
      <h3>Add a class manually</h3><div class="field"><label>Subject</label><input id="subject" placeholder="Mathematics"></div><div class="field"><label>Teacher email</label><input id="teacherEmail" placeholder="teacher@school.ph"></div><div class="field"><label>Section</label><input id="section" placeholder="Grade 10 - St. Catherine"></div><div class="field"><label>Room</label><input id="room" placeholder="Room 201"></div><div class="field"><label>Day</label><select id="day"><option>Mon</option><option>Tue</option><option>Wed</option><option>Thu</option><option>Fri</option></select></div><div class="field"><label>Start</label><input id="start" type="time"></div><div class="field"><label>End</label><input id="end" type="time"></div><br><button onclick="addClass()">Add class</button><div id="error" class="err" role="alert"></div></section>` : '';
    const table = schedules.length ? `<div class="card" style="overflow:auto"><table><thead><tr><th>Day</th><th>Time</th><th>Subject</th><th>Section</th><th>Room</th><th>Instructor</th><th>Teacher status</th>${staff ? '<th>Absence / coverage</th>' : ''}</tr></thead><tbody>${schedules.map(row => `<tr><td>${esc(row.day)}</td><td>${esc(row.start)}–${esc(row.end)}</td><td>${esc(row.subject)}</td><td>${esc(row.section)}</td><td>${esc(row.room)}</td><td>${esc(row.substituteName || row.teacherName || row.teacherEmail)}${row.substituteEmail ? `<br><small class="muted">Covering for ${esc(row.teacherName || row.teacherEmail)}</small>` : ''}</td><td>${badge(row.teacherStatus || (row.substituteEmail ? 'Substitute assigned' : 'Present'))}</td>${staff ? `<td>${row.substituteEmail ? badge('Substitute assigned') : `<button class="secondary" onclick="substitute('${row._id}')">${row.teacherStatus === 'Absent' ? 'Assign substitute' : 'Mark absent / assign cover'}</button>`}</td>` : ''}</tr>`).join('')}</tbody></table></div>` : '<div class="card empty">No classes found for this account.</div>';
    document.getElementById('box').innerHTML = controls + table;
  } catch (error) { document.getElementById('box').innerHTML = `<p class="err">${esc(error.error || error.message)}</p>`; }
}
async function addClass() {
  const fields = Object.fromEntries(['subject', 'teacherEmail', 'section', 'room', 'day', 'start', 'end'].map(key => [key, document.getElementById(key).value.trim()]));
  try { await api('schedules', 'POST', fields); await load(); }
  catch (error) { document.getElementById('error').textContent = error.error || 'Could not add class.'; }
}
async function generate() {
  if (!confirm('Replace the current timetable with a conflict-free schedule generated from teacher assignments?')) return;
  try { const result = await api('schedules/generate', 'POST', {}); alert(`Generated ${result.count} class meetings.`); await load(); }
  catch (error) { alert(error.error || 'Schedule generation failed.'); }
}
async function substitute(id) {
  if (!confirm('Mark this instructor absent and assign the best available substitute?')) return;
  try { const result = await api('substitute', 'POST', { id }); alert(`Substitute assigned: ${result.substitute}`); await load(); }
  catch (error) { alert(error.error || 'No substitute could be assigned.'); }
}
load();
</script></body></html>
