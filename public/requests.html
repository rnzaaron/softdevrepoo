<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document requests</title></head>
<body><nav id="nav"></nav><main><h1 id="title"></h1><p class="subhead">Submit document requests or manage the school's request queue with easy status updates.</p><div id="box"></div></main>
<script src="common.js"></script><script>
// Students and parents only receive their own requests; adviser/admin accounts manage the queue.
init('Document requests');

async function load() {
  try {
    const requests = await api('requests');
    const canRequest = ['student', 'parent'].includes(user.role);
    const parentChildren = user.role === 'parent' ? (user.children || []) : [];

    const childField = (user.role === 'parent' && parentChildren.length) ? `
      <label class="field">For child
        <select id="childId">
          ${parentChildren.map(cid => `<option value="${esc(cid)}">${esc(cid)}</option>`).join('')}
        </select>
      </label>` : '';

    const form = canRequest ? `<section class="card"><h2>Request a document</h2>
      ${childField}
      <label class="field">Document
        <select id="kind">
          <option>Transcript of Records</option>
          <option>Good Moral Certificate</option>
          <option>Enrollment Certificate</option>
          <option>Other</option>
        </select>
      </label>
      <br><button onclick="submitRequest()">Submit request</button>
      <div id="requestMsg" class="err"></div>
    </section>` : '';

    const searchBar = requests.length ? `<div class="toolbar"><input class="search-box" id="requestSearch" placeholder="🔍 Search document requests..."></div>` : '';

    const rows = requests.length ? `<section class="card" style="overflow:auto">${searchBar}<table id="requestsTable"><thead><tr><th>Document</th><th>Requested by</th><th>Student ID</th><th>Requested date</th><th>Status</th>${canRequest ? '' : '<th>Update status</th>'}</tr></thead><tbody>${requests.map(item => `<tr><td><b>${esc(item.kind)}</b></td><td>${esc(item.userName)}</td><td>${esc(item.studentId)}</td><td>${new Date(item.createdAt).toLocaleString()}</td><td>${badge(item.status)}</td>${canRequest ? '' : `<td><select id="status-${item._id}"><option ${item.status === 'Pending' ? 'selected' : ''}>Pending</option><option ${item.status === 'Processing' ? 'selected' : ''}>Processing</option><option ${item.status === 'Ready' ? 'selected' : ''}>Ready</option><option ${item.status === 'Rejected' ? 'selected' : ''}>Rejected</option></select><button onclick="updateRequest('${item._id}')">Save</button></td>`}</tr>`).join('')}</tbody></table></section>` : '<section class="card empty">No document requests found.</section>';

    document.getElementById('box').innerHTML = form + rows;
    makeTableSearchable('requestSearch', '#requestsTable');
  } catch (error) { document.getElementById('box').innerHTML = `<p class="err">${esc(error.error || error.message)}</p>`; }
}

async function submitRequest() {
  const childSelect = document.getElementById('childId');
  const studentId = childSelect ? childSelect.value : (user.studentId || '');
  const kind = document.getElementById('kind').value;
  try {
    await api('requests', 'POST', { kind, studentId });
    alert('Document request submitted successfully!');
    await load();
  } catch (error) {
    document.getElementById('requestMsg').textContent = error.error || error.message || 'Request was not submitted.';
  }
}

async function updateRequest(id) {
  try {
    await api(`requests/${id}`, 'PUT', { status: document.getElementById(`status-${id}`).value });
    alert('Status updated successfully!');
    await load();
  } catch (error) { alert(error.error || error.message || 'Request was not updated.'); }
}

load();
</script></body></html>
