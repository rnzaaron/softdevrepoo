<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration</title>
<style>
html body{--forest:#073f3a;--green:#087f70;--leaf:#18a591;--mint:#d9f1ec;background:var(--paper)}
html body main{background:linear-gradient(135deg,rgba(244,248,244,.96),rgba(228,242,233,.9));backdrop-filter:blur(3px)}
html body main .card{background:rgba(251,253,251,.97);border-color:#c9ddce;box-shadow:0 3px 12px rgba(16,59,45,.12)}
@media(max-width:760px){html body main{background:rgba(244,248,244,.94)}}
</style></head>
<body><nav id="nav"></nav><main><h1 id="title"></h1><p class="subhead">Manage academic records and rules with automated dropdown inputs and quick navigation.</p><div id="box"></div></main>
<script src="common.js"></script><script>
init('Administration');
const entities = {
  students: [['name', 'Student name'], ['studentId', 'Student ID'], ['birthdate', 'Birthdate'], ['age', 'Age'], ['address', 'Address'], ['guardianName', 'Guardian name'], ['guardianMobile', 'Guardian mobile'], ['studentContact', 'Student contact'], ['gradeLevel', 'Grade level'], ['section', 'Section'], ['strand', 'Strand'], ['email', 'Student email'], ['parentEmail', 'Parent email']],
  teachers: [['name', 'Teacher name'], ['email', 'Teacher email'], ['subjects', 'Qualified subjects (comma separated)'], ['workload', 'Current workload'], ['unavailable', 'Unavailable slots: Mon 08:00-09:00, Tue 13:00-14:00']],
  sections: [['name', 'Section name'], ['gradeLevel', 'Grade level'], ['adviser', 'Adviser name']],
  subjects: [['name', 'Subject name'], ['code', 'Subject code']],
  rooms: [['name', 'Room name'], ['capacity', 'Capacity']],
  users: [['name', 'Display name'], ['email', 'Email'], ['role', 'Role'], ['password', 'Password'], ['studentId', 'Student ID (student account)'], ['section', 'Section (student/adviser)'], ['children', 'Child student IDs (comma separated)']],
  teacher_assignments: [['subject', 'Subject'], ['section', 'Section'], ['teacherEmail', 'Teacher email'], ['teacherName', 'Teacher name'], ['room', 'Room']]
};
let activeEntity = 'students'; let editingId = '';
let cachedOptions = { sections: [], subjects: [], teachers: [], rooms: [] };
const box = document.getElementById('box');

async function load() {
  try {
    const [stats, options] = await Promise.all([
      api('stats'),
      api('options').catch(() => ({ sections: [], subjects: [], teachers: [], rooms: [] }))
    ]);
    cachedOptions = options;

    box.innerHTML = `<div class="cards">${[['Students', stats.students], ['Teachers', stats.teachers], ['Sections', stats.sections]].map(([label, value]) => `<section class="card"><div class="metric">${value}</div><div class="muted">${label}</div></section>`).join('')}</div>
      <section class="card"><h2>School records</h2>
        <div class="toolbar"><div id="entityButtons">${Object.keys(entities).map(key => `<button class="${activeEntity === key ? '' : 'secondary'}" data-entity="${key}" onclick="selectEntity('${key}')">${key.replace('_', ' ')}</button>`).join('')}</div></div>
        <div id="recordPanel"></div></section>
      <section class="card"><h2>Grading formula and schedule slots</h2><p class="muted">Period options: Prelim, Midterm, Final. Component weights must total 1.00 (100%).</p><div id="configPanel"></div></section>
      <section class="card"><h2>Grade workflow</h2><p>Monitor uploads, request corrections, approve, and finalize student grades.</p><a href="grades.html">Open grade management</a></section>`;
    await Promise.all([loadEntity(), loadConfig()]);
  } catch (error) { box.innerHTML = `<p class="err">${esc(error.error || error.message)}</p>`; }
}

function selectEntity(name) {
  activeEntity = name;
  editingId = '';
  document.querySelectorAll('#entityButtons button').forEach(btn => {
    btn.className = (btn.dataset.entity === name) ? '' : 'secondary';
  });
  loadEntity();
}

function inputFor([name, label], value = '', editMode = false) {
  // Skip studentId in form for students (auto-generated by server)
  if (name === 'studentId' && activeEntity === 'students') {
    if (editMode) {
      return `<label class="field">${esc(label)}<input data-field="studentId" type="text" value="${esc(value)}" readonly style="background:#eee;cursor:not-allowed"></label>`;
    }
    return '';
  }
  // Birthdate for students
  if (name === 'birthdate' && activeEntity === 'students') {
    return `<label class="field">${esc(label)}<input data-field="birthdate" type="date" value="${esc(value)}" onchange="document.querySelector('[data-field=age]').value = calculateAge(this.value)"></label>`;
  }
  // Age for students (read-only, auto-calculated)
  if (name === 'age' && activeEntity === 'students') {
    return `<label class="field">${esc(label)}<input data-field="age" type="number" value="${esc(value)}" readonly style="background:#eee;cursor:not-allowed"></label>`;
  }
  // Strand for students (dropdown, conditionally visible)
  if (name === 'strand' && activeEntity === 'students') {
    const strands = ['STEM', 'ABM', 'HUMSS', 'ICT'];
    const show = ['Grade 11', 'Grade 12'].includes(document.querySelector?.('[data-field="gradeLevel"]')?.value || '');
    return `<label class="field" id="strandField" style="display:${show || (editMode && value) ? '' : 'none'}">${esc(label)}<select data-field="strand"><option value="">— Select strand —</option>${strands.map(s => `<option value="${s}" ${value === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label>`;
  }
  // Grade level for students
  if (name === 'gradeLevel' && activeEntity === 'students') {
    const levels = ['Grade 7', 'Grade 8', 'Grade 9', 'Grade 10', 'Grade 11', 'Grade 12'];
    return `<label class="field">${esc(label)}<select data-field="gradeLevel" onchange="filterSectionsByGrade(this.value)"><option value="">— Select grade level —</option>${levels.map(lvl => `<option value="${lvl}" ${value === lvl ? 'selected' : ''}>${lvl}</option>`).join('')}</select></label>`;
  }
  // Section for students (filtered by grade level)
  if (name === 'section' && activeEntity === 'students') {
    const sections = cachedOptions.sections || [];
    return `<label class="field">${esc(label)}<select data-field="section" id="sectionDropdown">${sections.length ? sections.map(s => `<option value="${esc(s.name)}" ${value === s.name ? 'selected' : ''}>${esc(s.name)}</option>`).join('') : '<option value="">No sections available</option>'}</select></label>`;
  }
  // Dropdown for Role
  if (name === 'role') {
    return `<label class="field">${esc(label)}<select data-field="role"><option ${value === 'student' ? 'selected' : ''}>student</option><option ${value === 'parent' ? 'selected' : ''}>parent</option><option ${value === 'teacher' ? 'selected' : ''}>teacher</option><option ${value === 'adviser' ? 'selected' : ''}>adviser</option><option ${value === 'admin' ? 'selected' : ''}>admin</option></select></label>`;
  }
  // Dropdown for Section (non-student entities)
  if (name === 'section' && cachedOptions.sections?.length) {
    return `<label class="field">${esc(label)}<select data-field="section">${cachedOptions.sections.map(s => `<option value="${esc(s.name)}" ${value === s.name ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>`;
  }
  // Dropdown for Subject
  if (name === 'subject' && cachedOptions.subjects?.length) {
    return `<label class="field">${esc(label)}<select data-field="subject">${cachedOptions.subjects.map(s => `<option value="${esc(s.name)}" ${value === s.name ? 'selected' : ''}>${esc(s.name)}${s.code ? ` (${esc(s.code)})` : ''}</option>`).join('')}</select></label>`;
  }
  // Dropdown for Teacher Email
  if (name === 'teacherEmail' && cachedOptions.teachers?.length) {
    return `<label class="field">${esc(label)}<select data-field="teacherEmail" onchange="syncTeacherName(this)">${cachedOptions.teachers.map(t => `<option value="${esc(t.email)}" data-name="${esc(t.name)}" ${value === t.email ? 'selected' : ''}>${esc(t.name)} · ${esc(t.email)}</option>`).join('')}</select></label>`;
  }
  // Dropdown for Adviser Name
  if (name === 'adviser' && cachedOptions.teachers?.length) {
    return `<label class="field">${esc(label)}<select data-field="adviser">${cachedOptions.teachers.map(t => `<option value="${esc(t.name)}" ${value === t.name ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></label>`;
  }
  // Dropdown for Room
  if (name === 'room' && cachedOptions.rooms?.length) {
    return `<label class="field">${esc(label)}<select data-field="room">${cachedOptions.rooms.map(r => `<option value="${esc(r.name)}" ${value === r.name ? 'selected' : ''}>${esc(r.name)}${r.capacity ? ` (Cap: ${r.capacity})` : ''}</option>`).join('')}</select></label>`;
  }
  // Dropdown for Grade Level (non-student entities like sections)
  if (name === 'gradeLevel') {
    const levels = ['Grade 7', 'Grade 8', 'Grade 9', 'Grade 10', 'Grade 11', 'Grade 12', 'College 1st Year', 'College 2nd Year', 'College 3rd Year', 'College 4th Year'];
    return `<label class="field">${esc(label)}<select data-field="gradeLevel">${levels.map(lvl => `<option value="${lvl}" ${value === lvl ? 'selected' : ''}>${lvl}</option>`).join('')}</select></label>`;
  }
  // Textarea for Unavailable slots
  if (name === 'unavailable') {
    return `<label class="field">${esc(label)}<textarea data-field="unavailable" rows="2" placeholder="Mon 08:00-09:00, Tue 13:00-14:00">${esc(value)}</textarea></label>`;
  }
  const type = name === 'password' ? 'password' : name.includes('email') || name.includes('Email') ? 'email' : 'text';
  return `<label class="field">${esc(label)}<input data-field="${name}" type="${type}" value="${esc(value)}" ${name === 'password' ? 'autocomplete="new-password"' : ''}></label>`;
}

function syncTeacherName(select) {
  const selected = select.selectedOptions[0];
  const nameInput = document.querySelector('#recordForm [data-field="teacherName"]');
  if (selected && nameInput) nameInput.value = selected.dataset.name || '';
}

function filterSectionsByGrade(grade) {
  const sectionSelect = document.getElementById('sectionDropdown');
  const strandField = document.getElementById('strandField');
  if (sectionSelect) {
    const filtered = cachedOptions.sections.filter(s => s.gradeLevel === grade);
    sectionSelect.innerHTML = filtered.length
      ? filtered.map(s => `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('')
      : '<option value="">No sections for this grade level</option>';
  }
  if (strandField) {
    strandField.style.display = ['Grade 11', 'Grade 12'].includes(grade) ? '' : 'none';
  }
}

function calculateAge(birthdate) {
  if (!birthdate) return '';
  const birth = new Date(birthdate);
  const today = new Date();
  let age = today.getFullYear() - birth.getFullYear();
  const m = today.getMonth() - birth.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
  return age;
}

async function loadEntity() {
  try {
    const records = await api(`manage/${activeEntity}`);
    const definitions = entities[activeEntity];
    // For students, determine which fields to show in the form (exclude studentId in create mode)
    const formDefs = definitions;
    // For students table, show all fields; for others, hide password
    const tableDefs = definitions.filter(([key]) => key !== 'password');

    document.getElementById('recordPanel').innerHTML = `
      <form class="card" id="recordForm" onsubmit="saveRecord(event)">
        <h3>${editingId ? 'Edit' : 'Add'} ${activeEntity.replace('_', ' ')}</h3>
        ${formDefs.map(([key, label]) => inputFor([key, label], '', !!editingId)).join('')}
        <br><button>${editingId ? 'Save changes' : 'Add record'}</button>
        ${editingId ? '<button type="button" class="secondary" onclick="cancelEdit()">Cancel</button>' : ''}
        <div id="recordError" class="err"></div>
      </form>
      <div style="overflow:auto">
        <div class="toolbar"><input class="search-box" id="recordSearch" placeholder="🔍 Search ${activeEntity.replace('_', ' ')}..."></div>
        <table id="recordsTable"><thead><tr>${tableDefs.filter(([key]) => key !== 'password').map(([, label]) => `<th>${esc(label)}</th>`).join('')}<th>Actions</th></tr></thead><tbody>
          ${records.map(record => `<tr>${tableDefs.filter(([key]) => key !== 'password').map(([key]) => {
            let val = record[key];
            // Hide strand in table if empty
            if (key === 'strand' && activeEntity === 'students' && !val) val = '—';
            if (key === 'unavailable' && Array.isArray(val)) val = val.map(slot => `${slot.day} ${slot.start}-${slot.end}`).join(', ');
            else if (Array.isArray(val)) val = val.join(', ');
            return `<td>${esc(val ?? '')}</td>`;
          }).join('')}<td><button class="secondary" onclick="editRecord('${record._id}')">Edit</button><button class="danger" onclick="deleteRecord('${record._id}')">Delete</button></td></tr>`).join('')}
        </tbody></table>
        ${records.length ? '' : '<p class="empty">No records yet.</p>'}
      </div>`;
    makeTableSearchable('recordSearch', '#recordsTable');
    // Pre-populate teacherName if empty on teacher_assignments
    const teacherEmailSelect = document.querySelector('#recordForm [data-field="teacherEmail"]');
    if (teacherEmailSelect) syncTeacherName(teacherEmailSelect);
  } catch (error) { document.getElementById('recordPanel').innerHTML = `<p class="err">${esc(error.error || error.message)}</p>`; }
}

function formValues() {
  const values = {};
  document.querySelectorAll('#recordForm [data-field]').forEach(input => {
    let value = input.value.trim();
    if (['subjects', 'children'].includes(input.dataset.field)) value = value ? value.split(',').map(item => item.trim()).filter(Boolean) : [];
    if (input.dataset.field === 'unavailable') value = value ? value.split(',').map(entry => {
      const match = entry.trim().match(/^(Mon|Tue|Wed|Thu|Fri|Sat)\s+(\d{2}:\d{2})-(\d{2}:\d{2})$/i);
      if (!match || match[2] >= match[3]) throw new Error(`Invalid unavailable slot: ${entry.trim()}`);
      return { day: match[1][0].toUpperCase() + match[1].slice(1).toLowerCase(), start: match[2], end: match[3] };
    }) : [];
    if (input.dataset.field === 'workload' || input.dataset.field === 'capacity') value = Number(value || 0);
    values[input.dataset.field] = value;
  });
  return values;
}

async function saveRecord(event) {
  event.preventDefault();
  try {
    const values = formValues();
    await api(`manage/${activeEntity}${editingId ? `/${editingId}` : ''}`, editingId ? 'PUT' : 'POST', values);
    editingId = ''; await loadEntity();
  } catch (error) {
    document.getElementById('recordError').textContent = error.error || error.message || 'Could not save record.';
  }
}

async function editRecord(id) {
  const records = await api(`manage/${activeEntity}`); const record = records.find(item => item._id === id);
  if (!record) return;
  editingId = id; await loadEntity();
  for (const [key] of entities[activeEntity]) {
    const input = document.querySelector(`#recordForm [data-field="${key}"]`);
    if (!input || key === 'password') continue;
    input.value = key === 'unavailable' ? (record[key] || []).map(slot => `${slot.day} ${slot.start}-${slot.end}`).join(', ')
      : Array.isArray(record[key]) ? record[key].join(', ') : record[key] ?? '';
  }
  const role = document.querySelector('#recordForm [data-field="role"]'); if (role && record.role) role.value = record.role;
}

function cancelEdit() { editingId = ''; loadEntity(); }

async function deleteRecord(id) {
  if (!confirm('Delete this record? Related records are not automatically deleted.')) return;
  try { await api(`manage/${activeEntity}/${id}`, 'DELETE'); await loadEntity(); }
  catch (error) { alert(error.error || error.message || 'Could not delete record.'); }
}

async function loadConfig() {
  const config = await api('config'); const weights = config.weights || {};
  document.getElementById('configPanel').innerHTML = `<form onsubmit="saveConfig(event)"><div>${Object.entries(weights).map(([key, value]) => `<label class="field">${esc(key)} weight<input class="weight" data-name="${esc(key)}" type="number" min="0" max="1" step="0.01" value="${value}" required></label>`).join('')}</div><h3>Available time slots</h3><p class="muted">One slot per line in 24-hour time, for example 08:00-09:00.</p><textarea id="slots" rows="4">${(config.timeSlots || []).map(slot => `${esc(slot.start)}-${esc(slot.end)}`).join('\n')}</textarea><br><button>Save academic settings</button><span id="configMessage" class="muted"></span></form>`;
}

async function saveConfig(event) {
  event.preventDefault();
  const weights = {};
  document.querySelectorAll('.weight').forEach(input => weights[input.dataset.name] = Number(input.value));
  const timeSlots = document.getElementById('slots').value.split(/\r?\n/).filter(Boolean).map(line => {
    const [start, end] = line.trim().split('-').map(value => value.trim()); return { start, end };
  });
  try { await api('config', 'PUT', { weights, timeSlots, days: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'] }); document.getElementById('configMessage').textContent = 'Settings saved.'; }
  catch (error) { document.getElementById('configMessage').textContent = error.error || error.message || 'Settings were not saved.'; }
}

load();
</script></body></html>
