<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grades</title><script src="/vendor/exceljs.min.js"></script></head>
<body><nav id="nav"></nav><main><h1 id="title"></h1><p class="subhead">Grades are organized by academic period and released after adviser finalization.</p><div id="box"></div></main>
<script src="common.js"></script><script>
// Teachers preview Excel rows before saving a batch; only finalized grades are visible to families.
init('Grade management');
let parsedRows = [];
const familyRole = ['student', 'parent'].includes(user.role);
const gradesTable = rows => rows.length ? `<div class="card"><table><thead><tr><th>Student</th><th>Subject</th><th>Professor</th><th>Period</th><th>Components</th><th>Computed</th><th>Final</th><th>Status</th></tr></thead><tbody>${rows.map(row => `<tr><td>${esc(row.studentName)}<br><small>${esc(row.studentId)}</small></td><td>${esc(row.subject)}</td><td>${esc(row.teacherName)}</td><td>${esc(row.period)}</td><td>${Object.entries(row.components || {}).map(([name, value]) => `${esc(name)}: ${esc(value)}`).join('<br>')}</td><td>${esc(row.computed)}</td><td>${row.final == null ? '—' : esc(row.final)}</td><td>${badge(row.status)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="card empty">No grade records found.</div>';
async function load() {
  try {
    if (familyRole) { document.getElementById('box').innerHTML = gradesTable(await api('grades')); return; }
    const uploads = await api('uploads');
    let form = '';
    if (user.role === 'teacher') {
      const [assignments, config] = await Promise.all([api('assignments'), api('config')]);
      const components = Object.keys(config.weights || {});
      form = `<section class="card"><h2>Upload grades from Excel</h2><p class="muted">Excel columns: StudentID, ${components.map(esc).join(', ')}. Scores must be 0-100. Select the academic period separately.</p><button class="secondary" type="button" onclick="downloadTemplate(${JSON.stringify(components).replaceAll('"', '&quot;')})">Download Excel template</button><br>
        <label class="field">Subject<select id="subject">${assignments.map(row => `<option value="${esc(row.subject)}" data-section="${esc(row.section)}">${esc(row.subject)} · ${esc(row.section)}</option>`).join('')}</select></label>
        <label class="field">Period<select id="period"><option>Prelim</option><option>Midterm</option><option>Final</option></select></label>
        <label class="field">Excel file<input id="excel" type="file" accept=".xlsx" onchange="readExcel(this,${JSON.stringify(components).replaceAll('"', '&quot;')})"></label><div id="uploadMessage" role="alert"></div><div id="preview"></div>
        <button id="saveUpload" type="button" hidden onclick="saveUpload()">Save upload for review</button></section>`;
    }
    document.getElementById('box').innerHTML = form + (uploads.length ? uploads.map(renderUpload).join('') : '<div class="card empty">No submissions yet.</div>');
  } catch (error) { document.getElementById('box').innerHTML = `<p class="err">${esc(error.error || error.message)}</p>`; }
}
async function downloadTemplate(components) {
  const workbook = new ExcelJS.Workbook();
  const sheet = workbook.addWorksheet('Grades');
  sheet.addRow(['StudentID', ...components]); sheet.addRow(['SCC-2026-001', ...components.map(() => 85)]);
  const buffer = await workbook.xlsx.writeBuffer();
  const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([buffer]));
  link.download = 'st-catherine-grade-template.xlsx'; link.click(); URL.revokeObjectURL(link.href);
}
async function readExcel(input, components) {
  const message = document.getElementById('uploadMessage'); message.textContent = '';
  document.getElementById('saveUpload').hidden = true; document.getElementById('preview').innerHTML = '';
  const file = input.files[0]; if (!file) return;
  try {
    const expected = ['StudentID', ...components];
    const workbook = new ExcelJS.Workbook();
    await workbook.xlsx.load(await file.arrayBuffer());
    const worksheet = workbook.worksheets[0];
    if (!worksheet) throw new Error('The workbook does not contain a worksheet.');
    const headers = worksheet.getRow(1).values.slice(1).map(value => String(value || '').trim());
    const missing = expected.filter(key => !headers.includes(key));
    if (missing.length) throw new Error(`Missing Excel columns: ${missing.join(', ')}`);
    parsedRows = [];
    worksheet.eachRow({ includeEmpty: false }, (row, rowNumber) => {
      if (rowNumber === 1) return;
      const values = row.values.slice(1);
      parsedRows.push(Object.fromEntries(headers.map((header, index) => [header, values[index] ?? ''])));
    });
    if (!parsedRows.length) throw new Error('The first worksheet has no student rows.');
    document.getElementById('preview').innerHTML = `<h3>Preview · ${parsedRows.length} row(s)</h3><div style="overflow:auto"><table><thead><tr>${expected.map(key => `<th>${esc(key)}</th>`).join('')}</tr></thead><tbody>${parsedRows.map(row => `<tr>${expected.map(key => `<td>${esc(row[key])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    document.getElementById('saveUpload').hidden = false;
  } catch (error) { message.className = 'err'; message.textContent = error.message; parsedRows = []; }
}
async function saveUpload() {
  const selected = document.getElementById('subject').selectedOptions[0];
  try {
    const result = await api('uploads', 'POST', { subject: selected.value, section: selected.dataset.section, period: document.getElementById('period').value, rows: parsedRows });
    alert(`Validated and saved ${result.preview.length} student grades. Submit the batch below when ready.`);
    parsedRows = []; await load();
  } catch (error) {
    const issues = error.errors || [error.error || 'Upload could not be saved.'];
    document.getElementById('uploadMessage').className = 'err';
    document.getElementById('uploadMessage').innerHTML = issues.map(issue => `<p>${esc(issue)}</p>`).join('');
  }
}
function renderUpload(upload) {
  const teacher = user.role === 'teacher'; const adviser = user.role === 'adviser';
  const pending = ['Pending Review', 'Resubmitted'].includes(upload.status);
  const components = Object.keys(upload.grades[0]?.components || {});
  const actionButtons = teacher && upload.status === 'Uploaded' ? `<button onclick="act('${upload._id}','submit')">Submit to adviser</button>` :
    teacher && upload.status === 'For Correction' ? '<p class="notice">Corrections requested. Upload the corrected Excel file above.</p>' :
      adviser && pending ? `<button onclick="act('${upload._id}','approve')">Approve</button><button class="secondary" onclick="act('${upload._id}','correction')">Request correction</button>` :
        adviser && upload.status === 'Approved' ? `<button onclick="act('${upload._id}','finalize')">Finalize and release</button>` : '';
  return `<section class="card"><div class="toolbar"><div><h3>${esc(upload.subject)} · ${esc(upload.period)}</h3><div class="muted">${esc(upload.section)} · ${esc(upload.teacherName)} · ${new Date(upload.uploadedAt).toLocaleString()}</div></div>${badge(upload.status)}</div>${actionButtons}<div style="overflow:auto"><table><thead><tr><th>Student ID</th><th>Student</th>${components.map(name => `<th>${esc(name)}</th>`).join('')}<th>Computed</th></tr></thead><tbody>${upload.grades.map(row => `<tr><td>${esc(row.studentId)}</td><td>${esc(row.studentName)}</td>${components.map(name => `<td>${esc(row.components?.[name])}</td>`).join('')}<td>${esc(row.computed)}</td></tr>`).join('')}</tbody></table></div></section>`;
}
async function act(id, action) {
  const prompts = { submit: 'Submit these grades to the adviser?', approve: 'Approve this grade batch?', finalize: 'Finalize and release these grades to students and parents?' };
  if (!confirm(prompts[action] || 'Request corrections for this batch?')) return;
  const note = action === 'correction' ? prompt('What needs correction?') || '' : '';
  try { await api(`uploads/${id}/${action}`, 'PUT', { note }); await load(); }
  catch (error) { alert(error.error || 'Action failed.'); }
}
load();
</script></body></html>
