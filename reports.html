<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report cards</title></head>
<body><nav id="nav"></nav><main><h1 id="title"></h1><p class="subhead">Generated after adviser finalization. Local email actions are recorded in the demo delivery inbox.</p><div id="box"></div></main>
<script src="common.js"></script><script>
// Report cards are created by grade finalization and scoped to each student/linked parent.
init('Report cards');
async function load() {
  try {
    const reports = await api('reports');
    if (!reports.length) { document.getElementById('box').innerHTML = '<section class="card empty">No finalized report cards are available yet.</section>'; return; }
    const staff = ['admin', 'adviser'].includes(user.role);
    document.getElementById('box').innerHTML = reports.map(report => `<article class="card"><div class="toolbar"><div><h2>${esc(report.studentName)} · ${esc(report.period)}</h2><div class="muted">Student ID ${esc(report.studentId)} · ${esc(report.section)} · Generated ${new Date(report.generatedAt).toLocaleString()}</div></div>${badge(report.status)}</div><div style="overflow:auto"><table><thead><tr><th>Subject</th><th>Professor</th><th>Component grades</th><th>Final grade</th><th>Remarks</th></tr></thead><tbody>${report.grades.map(grade => `<tr><td>${esc(grade.subject)}</td><td>${esc(grade.teacherName)}</td><td>${Object.entries(grade.components || {}).map(([key, value]) => `${esc(key)} ${esc(value)}`).join(' · ')}</td><td>${esc(grade.final)}</td><td>${grade.final >= 75 ? 'Passed' : 'Needs review'}</td></tr>`).join('')}</tbody></table></div><p>Email status: ${badge(report.emailStatus || 'Not sent')}${staff ? ` <button onclick="sendReport('${report._id}')">Send report to parent</button>` : ''}</p></article>`).join('');
    if (staff) {
      const deliveries = await api('email-records');
      document.getElementById('box').insertAdjacentHTML('beforeend', `<section class="card"><h2>Local demo email inbox</h2>${deliveries.length ? `<table><thead><tr><th>Recipient</th><th>Subject</th><th>Mode</th><th>Delivered</th></tr></thead><tbody>${deliveries.map(item => `<tr><td>${esc(item.recipient)}</td><td>${esc(item.subject)}</td><td>${esc(item.mode)}</td><td>${new Date(item.sentAt).toLocaleString()}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">No report emails have been recorded.</p>'}</section>`);
    }
  } catch (error) { document.getElementById('box').innerHTML = `<p class="err">${esc(error.error || error.message)}</p>`; }
}
async function sendReport(id) {
  if (!confirm('Deliver this report to the linked parent in the local demo inbox?')) return;
  try { const result = await api(`reports/${id}/email`, 'POST', {}); alert(`Recorded local delivery to ${result.delivery.recipient}.`); await load(); }
  catch (error) { alert(error.error || 'Could not record delivery.'); }
}
load();
</script></body></html>
