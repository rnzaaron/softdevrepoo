<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade levels & sections</title></head>
<body><nav id="nav"></nav><main><h1 id="title"></h1><p class="subhead">Manage grade levels and sections. Add more sections whenever enrollment grows.</p><div id="box"></div></main>
<script src="common.js"></script><script>
// Admin page: grade levels grouped by classification, each with an expandable section table (capacity, enrolment, actions).
init('Grade levels & sections');
const $ = id => document.getElementById(id);
let D, open = new Set();
async function load() {
  try { if (user.role !== 'admin') throw { error: 'Only administrators can manage grade levels and sections.' }; D = await api('grade-levels'); draw(); }
  catch (e) { $('box').innerHTML = `<p class="err">${esc(e.error || e.message)}</p>`; }
}
const nextName = l => { const used = l.sections.map(s => (s.sectionName || '').toLowerCase()); for (const c of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') if (!used.includes('section ' + c.toLowerCase())) return 'Section ' + c; return ''; };
// Runs an action, then reloads; shows the server's message if it is refused (duplicate, full, still has students...).
const run = async fn => { try { await fn(); await load(); } catch (e) { alert(e.error || 'The action failed.'); } };
function draw() {
  const q = ($('q')?.value || '').toLowerCase(), cls = $('cls')?.value || '', st = $('st')?.value || '';
  const keep = [q, cls, st];
  const shown = D.levels.map((l, i) => ({ l, i })).filter(({ l }) => (!cls || l.classification === cls) &&
    (!q || l.name.toLowerCase().includes(q) || l.sections.some(s => (s.sectionName || '').toLowerCase().includes(q))));
  $('box').innerHTML = `<section class="card"><div class="toolbar"><input class="search-box" id="q" value="${esc(keep[0])}" placeholder="🔍 Search grade level or section..." oninput="draw()">
    <select id="cls" onchange="draw()"><option value="">All classifications</option>${D.classes.map(c => `<option ${c === cls ? 'selected' : ''}>${c}</option>`).join('')}</select>
    <select id="st" onchange="draw()"><option value="">All sections</option><option value="a" ${st === 'a' ? 'selected' : ''}>Active only</option><option value="i" ${st === 'i' ? 'selected' : ''}>Inactive only</option></select></div>
    <b>Add grade level:</b> <input id="gn" placeholder="e.g. Grade 13"> <select id="gc">${D.classes.map(c => `<option>${c}</option>`).join('')}</select> <button onclick="addLevel()">Add</button><br>
    <b>SHS strands:</b> <input id="strands" size="30" value="${esc(D.strands.join(', '))}"> <button onclick="saveStrands()">Save strands</button></section>` +
    D.classes.map(c => { const rows = shown.filter(({ l }) => l.classification === c); return rows.length ? `<h2>${c}</h2>` + rows.map(({ l, i }) => level(l, i, q, st)).join('') : ''; }).join('');
  $('q')?.focus(); const el = $('q'); if (el) el.setSelectionRange(el.value.length, el.value.length);
}
function level(l, i, q, st) {
  const secs = l.sections.filter(s => (!st || (st === 'a') === s.active) && (!q || l.name.toLowerCase().includes(q) || (s.sectionName || '').toLowerCase().includes(q)));
  const shs = D.shsLevels.includes(l.name);
  return `<details class="card" ${open.has(l.name) ? 'open' : ''} ontoggle="this.open ? open.add('${esc(l.name)}') : open.delete('${esc(l.name)}')" style="overflow:auto">
    <summary><b>${esc(l.name)}</b> — ${l.sections.filter(s => s.active).length} active sections · ${l.enrolled} students enrolled · ${l.slots} slots available</summary>
    <table><thead><tr><th>Section</th>${shs ? '<th>Strand</th>' : ''}<th>Enrolled / capacity</th><th>Status</th><th>Actions</th></tr></thead><tbody>
    ${secs.map(s => `<tr><td><b>${esc(s.sectionName || s.name)}</b></td>${shs ? `<td>${esc(s.strand || '—')}</td>` : ''}<td>${s.enrolled}/${s.capacity} ${s.enrolled >= s.capacity ? badge('FULL') : ''}</td><td>${badge(s.active ? 'Active' : 'Inactive')}</td>
    <td><button onclick="editSec('${s._id}')">Edit</button><button onclick="toggle('${s._id}',${!s.active},'${esc(s.sectionName || s.name)}')">${s.active ? 'Deactivate' : 'Reactivate'}</button>
    <button onclick="viewStudents('${esc(s.name)}')">View students</button><button onclick="delSec('${s._id}','${esc(s.sectionName || s.name)}')">Delete</button></td></tr>`).join('') || '<tr><td colspan="5">No sections match.</td></tr>'}</tbody></table>
    <p><b>Add section:</b> <input id="sn-${i}" value="${esc(nextName(l))}" size="12"> capacity <input id="cp-${i}" type="number" min="1" max="100" value="40" style="width:70px">
    ${shs ? `<select id="sr-${i}"><option value="">Any strand</option>${D.strands.map(s => `<option>${esc(s)}</option>`).join('')}</select>` : ''}
    <button onclick="addSec(${i})">Add section</button></p></details>`;
}
const find = id => D.levels.flatMap(l => l.sections).find(s => s._id === id);
function addLevel() { run(() => api('grade-levels', 'POST', { name: $('gn').value, classification: $('gc').value })); }
function saveStrands() { run(() => api('strands', 'PUT', { strands: $('strands').value.split(',') })); }
function addSec(i) { const l = D.levels[i]; run(() => api('sections', 'POST', { gradeLevel: l.name, sectionName: $('sn-' + i).value, capacity: $('cp-' + i).value, strand: $('sr-' + i)?.value || '' })); }
function editSec(id) {
  const s = find(id), n = prompt('Section name', s.sectionName || s.name); if (n === null) return;
  const c = prompt('Maximum students', s.capacity); if (c === null) return;
  run(() => api('sections/' + id, 'PUT', { sectionName: n, capacity: c }));
}
function toggle(id, active, name) { if (confirm(`${active ? 'Reactivate' : 'Deactivate'} ${name}?`)) run(() => api('sections/' + id, 'PUT', { active })); }
function delSec(id, name) { if (confirm(`Delete ${name}? This cannot be undone.`)) run(() => api('manage/sections/' + id, 'DELETE')); }
async function viewStudents(section) {
  try { const list = await api('students?section=' + encodeURIComponent(section)); alert(list.length ? list.map(s => `${s.studentId} — ${s.name}${s.strand ? ' (' + s.strand + ')' : ''}`).join('\n') : 'No students enrolled in this section.'); }
  catch (e) { alert(e.error || 'Could not load students.'); }
}
load();
</script></body></html>
